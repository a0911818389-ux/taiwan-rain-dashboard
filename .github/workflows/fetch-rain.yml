name: Fetch Live Rain Data

on:
  schedule:
    - cron: '*/20 * * * *'  
    workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CWA rainfall data
        env:
          CWA_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          curl -s "https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0002-001?Authorization=${CWA_KEY}&downloadType=WEB&format=JSON" -o rain-live.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rain-live.json
          git diff --cached --quiet || git commit -m "自動更新即時雨量資料"
          git push
          
